name: SURVIVAL cycles
on:
  # Phases 1/2 are finished. Their engine remains available manually.
  # Phase 3 uses persistent Cloudflare alarms, not Actions cron.
  workflow_dispatch:
    inputs:
      action:
        description: 'api-check tests public market access without START. start creates the competition; cycle resumes it.'
        type: choice
        options: [cycle, start, prepare-phase2, export, api-check, azure-check, research-check, health, cost-report]
        default: cycle
      experiment:
        description: 'Phase 2 = survival-002. Phase 1 remains archived; START never resets an experiment.'
        type: choice
        options: [survival-002, survival-001]
        default: survival-002
      source:
        description: 'Dispatch origin for operational diagnosis; never a trading instruction.'
        type: choice
        options: [manual, supabase-watchdog, cloudflare-watchdog]
        default: manual
permissions:
  contents: read
concurrency:
  group: survival-production
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPERIMENT_ID: ${{ inputs.experiment || vars.EXPERIMENT_ID || 'survival-001' }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-10-21' }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_DEPLOYMENT_PHASE2: ${{ vars.AZURE_OPENAI_DEPLOYMENT_PHASE2 || 'gpt-6.1-sol-2' }}
      SURVIVAL_TRIGGER_SOURCE: ${{ inputs.source || github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Run authorized command
        env:
          COMMAND: ${{ inputs.action || 'cycle' }}
        run: |
          # A single retry preserves run identity and the independently committed
          # LLM quotas. No repeated fill can be committed for this run.
          python -m survival.cli "$COMMAND" --cycle-id "${{ github.run_id }}" || {
            if [ "$COMMAND" != "cycle" ]; then exit 1; fi
            sleep 20
            python -m survival.cli "$COMMAND" --cycle-id "${{ github.run_id }}"
          }
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'export'
        with:
          name: survival-export
          path: exports/
          retention-days: 7
